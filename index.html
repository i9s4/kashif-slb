<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>منصة كاشف</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden}
.bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(30,111,255,.06) 0%,transparent 70%);top:-150px;right:-150px;pointer-events:none}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(30,111,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(30,111,255,.02) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.wrap{width:100%;max-width:380px;position:relative;z-index:1}
.logo-area{text-align:center;margin-bottom:24px}
.login-card{background:var(--s1);border:1px solid var(--b2);border-radius:20px;padding:28px 24px}
.tabs{display:flex;background:var(--bg);border:1px solid var(--b1);border-radius:10px;padding:3px;margin-bottom:20px}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;color:var(--t3);cursor:pointer;border-radius:8px;transition:all .2s;user-select:none}
.tab.a{background:var(--acc);color:#fff;font-weight:500}
.pending{background:rgba(30,111,255,.08);border:1px solid rgba(30,111,255,.2);border-radius:12px;padding:20px;text-align:center;display:none}
.pending p{font-size:12px;color:var(--t2);line-height:1.8}
.pending .icon{font-size:32px;margin-bottom:10px}
.notice{margin-top:14px;padding:12px 14px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:10px;text-align:center}
.notice p{font-size:11px;color:#fbbf24;line-height:1.8}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="wrap">
  <div class="logo-area">
    <svg width="160" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(44,10)">
        <rect x="2" y="22" width="52" height="14" rx="3" fill="none" stroke="#3d85ff" stroke-width="1.6"/>
        <path d="M9 22 L13 11 L41 11 L47 22 Z" fill="none" stroke="#3d85ff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M41 22 L38 13 L28 13 L28 22 Z" fill="#0f2044" stroke="#6aa3ff" stroke-width="0.8"/>
        <path d="M9 22 L12 13 L22 13 L22 22 Z" fill="#0f2044" stroke="#6aa3ff" stroke-width="0.8"/>
        <circle cx="40" cy="37" r="6" fill="#060d1a" stroke="#3d85ff" stroke-width="1.6"/>
        <circle cx="40" cy="37" r="2.5" fill="#1c3356"/>
        <circle cx="14" cy="37" r="6" fill="#060d1a" stroke="#3d85ff" stroke-width="1.6"/>
        <circle cx="14" cy="37" r="2.5" fill="#1c3356"/>
        <line x1="49" y1="27" x2="56" y2="27" stroke="#6aa3ff" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="59" cy="9" r="7" fill="none" stroke="#6aa3ff" stroke-width="1.4"/>
        <circle cx="59" cy="9" r="3" fill="none" stroke="#6aa3ff" stroke-width="0.8"/>
        <line x1="64" y1="14" x2="68" y2="18" stroke="#6aa3ff" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="80" y="76" font-family="IBM Plex Sans Arabic,sans-serif" font-size="28" font-weight="600" fill="#f0f4ff" letter-spacing="2" text-anchor="middle">كاشف</text>
      <text x="80" y="93" font-family="IBM Plex Sans Arabic,sans-serif" font-size="11" fill="#4d6a8a" text-anchor="middle">أداة مساعدة لتقييم المركبات</text>
      <line x1="16" y1="101" x2="144" y2="101" stroke="#1c3356" stroke-width="0.5"/>
      <text x="80" y="114" font-family="sans-serif" font-size="9" fill="#253c58" text-anchor="middle" letter-spacing="1">KASHIF · Vehicle Valuation Tool</text>
    </svg>
  </div>

  <div class="login-card">
    <div class="tabs">
      <div class="tab a" onclick="showTab('login',this)">تسجيل الدخول</div>
      <div class="tab" onclick="showTab('register',this)">حساب جديد</div>
    </div>

    <div id="msg" class="msg"></div>

    <div id="f-login">
      <div class="field"><label>البريد الإلكتروني</label>
        <input class="inp" id="l-email" type="email" placeholder="example@email.com" dir="ltr" autocomplete="email">
      </div>
      <div class="field"><label>كلمة المرور</label>
        <input class="inp" id="l-pass" type="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="btn btn-blue" style="width:100%;margin-top:4px" id="l-btn" onclick="login()">دخول</button>
    </div>

    <div id="f-register" style="display:none">
      <div class="field"><label>الاسم الكامل</label>
        <input class="inp" id="r-name" placeholder="أدخل اسمك الكامل" autocomplete="name">
      </div>
      <div class="field"><label>البريد الإلكتروني</label>
        <input class="inp" id="r-email" type="email" placeholder="example@email.com" dir="ltr" autocomplete="email">
      </div>
      <div class="field"><label>كلمة المرور</label>
        <input class="inp" id="r-pass" type="password" placeholder="٨ أحرف على الأقل" dir="ltr" autocomplete="new-password">
      </div>
      <button class="btn btn-blue" style="width:100%;margin-top:4px" id="r-btn" onclick="register()">إنشاء حساب</button>
    </div>

    <div class="pending" id="pending">
      <div class="icon">⏳</div>
      <p>تم إرسال طلب التسجيل بنجاح.<br>في انتظار موافقة المدير على حسابك.</p>
    </div>
  </div>

  <div class="notice">
    <p>⚠️ هذه الأداة غير رسمية وتهدف لاختصار الوقت والجهد.<br>الأسعار والمعلومات تقريبية وقابلة للخطأ، يرجى المراجعة والتحقق.</p>
  </div>
</div>

<script>
const SURL='https://eyspitmovlwytllqtndv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5c3BpdG1vdmx3eXRsbHF0bmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzQzNTcsImV4cCI6MjA5NTM1MDM1N30.qUBjDq6--xDc6XTJXva6lJ9twWWKWlEVxi8S6WtB-oA';
const{createClient}=supabase;
const sb=createClient(SURL,SKEY);

function showTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('a'));
  el.classList.add('a');
  document.getElementById('f-login').style.display=t==='login'?'block':'none';
  document.getElementById('f-register').style.display=t==='register'?'block':'none';
  showMsg('');
}
function showMsg(txt,type='err'){
  const el=document.getElementById('msg');
  el.textContent=txt;
  el.className='msg'+(txt?' '+type:'');
}

async function login(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass)return showMsg('يرجى ملء جميع الحقول');
  const btn=document.getElementById('l-btn');
  btn.disabled=true;btn.textContent='جاري الدخول...';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showMsg('البريد أو كلمة المرور غير صحيحة');btn.disabled=false;btn.textContent='دخول';return;}
  // قراءة بيانات المستخدم
  const{data:p,error:pErr}=await sb.from('profiles').select('role,is_approved').eq('id',data.user.id).single();
  if(pErr||!p){showMsg('خطأ في قراءة بيانات الحساب، تواصل مع المدير');btn.disabled=false;btn.textContent='دخول';await sb.auth.signOut();return;}
  if(!p.is_approved){showMsg('حسابك في انتظار موافقة المدير');btn.disabled=false;btn.textContent='دخول';await sb.auth.signOut();return;}
  // تحديث آخر دخول
  await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',data.user.id);
  window.location.href=p.role==='admin'?'admin.html':'search.html';
}

async function register(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pass=document.getElementById('r-pass').value;
  if(!name||!email||!pass)return showMsg('يرجى ملء جميع الحقول');
  if(pass.length<8)return showMsg('كلمة المرور يجب أن تكون ٨ أحرف على الأقل');
  const btn=document.getElementById('r-btn');
  btn.disabled=true;btn.textContent='جاري التسجيل...';
  // إنشاء الحساب
  const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error){showMsg(error.message);btn.disabled=false;btn.textContent='إنشاء حساب';return;}
  if(!data.user){showMsg('حدث خطأ، حاول مرة ثانية');btn.disabled=false;btn.textContent='إنشاء حساب';return;}
  // تسجيل دخول مباشر عشان نضيف في profiles
  const{data:ld,error:le}=await sb.auth.signInWithPassword({email,password:pass});
  if(!le&&ld.user){
    await sb.from('profiles').insert({id:ld.user.id,full_name:name,role:'employee',is_approved:false});
    await sb.auth.signOut();
  }
  // عرض رسالة الانتظار
  document.getElementById('f-register').style.display='none';
  document.getElementById('pending').style.display='block';
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
}

// تحقق إذا مسجل دخول مسبقاً
sb.auth.getSession().then(async({data:{session}})=>{
  if(!session)return;
  const{data:p}=await sb.from('profiles').select('role,is_approved').eq('id',session.user.id).single();
  if(p?.is_approved)window.location.href=p.role==='admin'?'admin.html':'search.html';
});
</script>
</body>
</html>
