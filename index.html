<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كاشف — تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page { padding-top: 1rem; }
    .en-line { direction: ltr; text-align: center; font-size: 0.78rem; color: var(--gray-600); letter-spacing: 0.12em; display: block; margin-top: 0.2rem; }
  </style>
</head>
<body>

<div class="auth-page">

  <!-- الشعار -->
  <div class="auth-logo">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="72" height="72" rx="18" fill="rgba(30,77,183,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
      <!-- سيارة -->
      <rect x="12" y="34" width="36" height="14" rx="4" fill="rgba(59,130,246,0.5)" stroke="rgba(96,165,250,0.7)" stroke-width="1.2"/>
      <path d="M16 34 L22 24 L38 24 L44 34" fill="rgba(30,77,183,0.7)" stroke="rgba(96,165,250,0.6)" stroke-width="1"/>
      <circle cx="21" cy="48" r="5" fill="var(--navy)" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
      <circle cx="21" cy="48" r="2.5" fill="rgba(96,165,250,0.6)"/>
      <circle cx="37" cy="48" r="5" fill="var(--navy)" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
      <circle cx="37" cy="48" r="2.5" fill="rgba(96,165,250,0.6)"/>
      <!-- عدسة بحث -->
      <circle cx="55" cy="29" r="10" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.5)" stroke-width="1.5"/>
      <circle cx="55" cy="29" r="6" fill="none" stroke="rgba(56,189,248,0.7)" stroke-width="1.5"/>
      <line x1="62" y1="36" x2="66" y2="40" stroke="rgba(56,189,248,0.8)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>كاشف</h1>
    <p>أداة مساعدة لتقييم المركبات</p>
    <span class="en-line">KASHIF · Vehicle Valuation Tool</span>
  </div>

  <!-- التنبيه الثابت -->
  <div class="alert alert-warning alert-permanent" style="max-width:460px;width:100%;margin-bottom:1.25rem;">
    ⚠️ هذه الأداة غير رسمية وتهدف لاختصار الوقت والجهد. الأسعار والمعلومات المعروضة تقريبية وقابلة للخطأ، يرجى المراجعة والتحقق.
  </div>

  <!-- البطاقة -->
  <div class="auth-card">

    <!-- التبويبات -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showTab('login')">تسجيل الدخول</div>
      <div class="auth-tab" id="tab-register" onclick="showTab('register')">حساب جديد</div>
    </div>

    <!-- رسالة الخطأ/النجاح -->
    <div id="auth-message" style="display:none;margin-bottom:1rem;"></div>

    <!-- نموذج تسجيل الدخول -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="login-email" placeholder="example@email.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required dir="ltr">
      </div>
      <button type="submit" class="btn btn-accent btn-lg btn-block" id="btn-login">
        <span id="btn-login-text">دخول</span>
        <div class="spinner" id="login-spinner" style="width:20px;height:20px;margin:0;display:none;border-width:2px;"></div>
      </button>
    </form>

    <!-- نموذج التسجيل -->
    <form id="form-register" style="display:none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <input type="text" class="form-control" id="reg-name" placeholder="محمد أحمد" required>
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="reg-email" placeholder="example@email.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" id="reg-password" placeholder="8 أحرف على الأقل" required dir="ltr" minlength="8">
        <div class="form-hint">8 أحرف على الأقل</div>
      </div>
      <div class="form-group">
        <label class="form-label">هل أنت موظف جمارك؟</label>
        <div class="form-radio-group">
          <label class="form-radio">
            <input type="radio" name="is_customs" value="yes" onchange="toggleWorkLocation(true)"> نعم
          </label>
          <label class="form-radio">
            <input type="radio" name="is_customs" value="no" onchange="toggleWorkLocation(false)" checked> لا
          </label>
        </div>
      </div>
      <div class="form-group" id="work-location-group" style="display:none;">
        <label class="form-label">موقع العمل</label>
        <select class="form-control" id="reg-location">
          <option value="">— اختر الموقع —</option>
          <option value="جمارك الصليبية">جمارك الصليبية</option>
          <option value="جمارك النويصيب">جمارك النويصيب</option>
          <option value="جمارك السالمي">جمارك السالمي</option>
          <option value="جمارك العبدلي">جمارك العبدلي</option>
          <option value="جمارك الشعيبة">جمارك الشعيبة</option>
          <option value="جمارك الشويخ">جمارك الشويخ</option>
          <option value="جمارك المطار">جمارك المطار</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>
      <div class="form-group" id="other-location-group" style="display:none;">
        <label class="form-label">اكتب موقع العمل</label>
        <input type="text" class="form-control" id="reg-location-other" placeholder="مثال: جمارك ميناء الزور">
      </div>
      <button type="submit" class="btn btn-accent btn-lg btn-block" id="btn-register">
        <span id="btn-register-text">إنشاء الحساب</span>
        <div class="spinner" id="register-spinner" style="width:20px;height:20px;margin:0;display:none;border-width:2px;"></div>
      </button>
      <div class="alert alert-info" style="margin-top:1rem;font-size:0.82rem;">
        ℹ️ حسابات موظفي الجمارك تحتاج موافقة المدير قبل تفعيلها.
      </div>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://eyspitmovlwytllqtndv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5c3BpdG1vdmx3eXRsbHF0bmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzQzNTcsImV4cCI6MjA5NTM1MDM1N30.qUBjDq6--xDc6XTJXva6lJ9twWWKWlEVxi8S6WtB-oA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// التحقق من الجلسة
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'search.html';
})();

function showTab(tab) {
  document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  hideMessage();
}

function toggleWorkLocation(show) {
  document.getElementById('work-location-group').style.display = show ? '' : 'none';
  if (!show) document.getElementById('other-location-group').style.display = 'none';
  const sel = document.getElementById('reg-location');
  if (show) {
    sel.onchange = () => {
      document.getElementById('other-location-group').style.display =
        sel.value === 'أخرى' ? '' : 'none';
    };
  }
}

function showMessage(msg, type='danger') {
  const el = document.getElementById('auth-message');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  el.style.display = '';
}

function hideMessage() {
  document.getElementById('auth-message').style.display = 'none';
}

function setLoading(btn, spinner, text, loading) {
  document.getElementById(btn).disabled = loading;
  document.getElementById(spinner).style.display = loading ? 'block' : 'none';
  document.getElementById(text).style.display   = loading ? 'none' : '';
}

async function handleLogin(e) {
  e.preventDefault();
  hideMessage();
  setLoading('btn-login','login-spinner','btn-login-text', true);
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    setLoading('btn-login','login-spinner','btn-login-text', false);
    showMessage('البريد الإلكتروني أو كلمة المرور غير صحيحة');
    return;
  }
  // التحقق من الاعتماد
  const { data: profile } = await sb.from('profiles').select('is_approved,role').eq('id', data.user.id).single();
  if (!profile?.is_approved) {
    await sb.auth.signOut();
    setLoading('btn-login','login-spinner','btn-login-text', false);
    showMessage('⏳ حسابك في انتظار الموافقة من المدير.','warning');
    return;
  }
  // تحديث آخر ظهور
  await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', data.user.id);
  window.location.href = 'search.html';
}

async function handleRegister(e) {
  e.preventDefault();
  hideMessage();
  const isCustoms = document.querySelector('input[name="is_customs"]:checked')?.value === 'yes';
  let workLocation = '';
  if (isCustoms) {
    workLocation = document.getElementById('reg-location').value;
    if (!workLocation) { showMessage('يرجى اختيار موقع العمل'); return; }
    if (workLocation === 'أخرى') {
      workLocation = document.getElementById('reg-location-other').value.trim();
      if (!workLocation) { showMessage('يرجى كتابة موقع العمل'); return; }
    }
  }
  setLoading('btn-register','register-spinner','btn-register-text', true);
  const { error } = await sb.auth.signUp({
    email:    document.getElementById('reg-email').value.trim(),
    password: document.getElementById('reg-password').value,
    options: { data: {
      full_name: document.getElementById('reg-name').value.trim(),
      is_customs_officer: isCustoms,
      work_location: workLocation || null
    }}
  });
  setLoading('btn-register','register-spinner','btn-register-text', false);
  if (error) { showMessage(error.message); return; }
  if (isCustoms) {
    showMessage('✅ تم التسجيل. حسابك في انتظار موافقة المدير.', 'success');
  } else {
    showMessage('✅ تم التسجيل. يمكنك تسجيل الدخول الآن.', 'success');
    setTimeout(() => showTab('login'), 2000);
  }
}
</script>
</body>
</html>
