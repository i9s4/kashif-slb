<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>كاشف — البحث</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.s-row{display:flex;gap:8px;margin-bottom:12px}
.s-inp{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--b2);border-radius:9px;font-size:13px;color:var(--t1);font-family:'IBM Plex Sans Arabic',sans-serif;outline:none}
.s-inp:focus{border-color:var(--acc2)}
.s-inp::placeholder{color:var(--t4)}
.flt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flt-lbl{font-size:11px;color:var(--t4)}
.vin-inp{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--b2);border-radius:9px;font-family:monospace;font-size:14px;color:var(--acc3);letter-spacing:2px;text-transform:uppercase;outline:none}
.vin-inp::placeholder{color:var(--t4);font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0;font-size:12px}
.vin-chars{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.vc{width:32px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--b2);font-family:monospace;font-size:13px;font-weight:500;color:var(--t2)}
.vc.wmi{background:#081f12;border-color:#0d5c33;color:#34d399}
.vc.vds{background:#1a1205;border-color:#7c4a0a;color:#fbbf24}
.vc.yr{background:#0a1530;border-color:var(--acc);color:var(--acc3)}
.vc-n{font-size:8px;color:var(--t4);margin-top:1px;font-family:'IBM Plex Sans Arabic',sans-serif}
.vin-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.vi-box{background:var(--s1);border:1px solid var(--b2);border-radius:9px;padding:10px}
.vi-lbl{font-size:10px;color:var(--t4);margin-bottom:3px}
.vi-val{font-size:13px;font-weight:500}
.prices-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.pb{background:var(--bg);border:1px solid var(--b1);border-radius:9px;padding:9px 7px;text-align:center}
.pb.kwd{border-color:var(--acc);background:#0a1530}
.pb-cur{font-size:9px;color:var(--t4);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.pb-val{font-size:13px;font-weight:500;color:var(--t1)}
.pb.kwd .pb-val{color:var(--acc3)}
.res-card{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.res-card:hover{border-color:var(--acc2)}
.res-card.sel{border-color:var(--acc);background:#080e1c}
.res-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px}
.res-name{font-size:15px;font-weight:500}
.res-badges{display:flex;gap:5px;flex-wrap:wrap}
.res-meta{font-size:11px;color:var(--t4);margin-bottom:12px}
.res-var{color:var(--acc2)}
.tax-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.tax-lbl{font-size:11px;color:var(--t4)}
.tax-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tax-bdg{font-size:12px;font-weight:500;color:#34d399;background:#061a0e;padding:3px 12px;border-radius:20px;border:1px solid #0a4022}
.print-b{padding:4px 10px;background:transparent;border:1px solid var(--b1);border-radius:7px;font-size:10px;color:var(--t4);cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif}
.cmp-panel{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:16px;margin-bottom:14px;display:none}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-item{background:var(--bg);border:1px solid var(--b1);border-radius:10px;padding:12px}
.cmp-name{font-size:13px;font-weight:500;margin-bottom:8px}
.cmp-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--b1)}
.cmp-row:last-child{border:none}
.cmp-k{color:var(--t4)}.cmp-v{color:var(--t1);font-weight:500}.cmp-v.hl{color:var(--acc3)}
.res-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.res-cnt{font-size:11px;color:var(--t4)}
.cmp-btn{padding:6px 14px;background:transparent;border:1px solid var(--b2);border-radius:7px;font-size:11px;color:var(--acc3);cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;display:none}
.empty{text-align:center;padding:50px 20px;color:var(--t4)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}
.rate-info{font-size:10px;color:var(--t4);margin-top:6px}
.blue{color:var(--acc3)}.green{color:#34d399}.amber{color:#fbbf24}
.topbar-title{font-size:13px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-name{font-size:12px;color:var(--t2);white-space:nowrap}
@media print{.topbar,.card,.flt-row,.res-hdr,.print-b,.btn-out,.cmp-btn,.vin-card{display:none!important}body{background:#fff;color:#000}.res-card{border:1px solid #ccc}.pb{border:1px solid #eee}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg width="90" viewBox="0 0 90 40" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(2,5)">
        <rect x="1" y="10" width="24" height="9" rx="2" fill="none" stroke="#3d85ff" stroke-width="1.3"/>
        <path d="M5 10 L7 4 L19 4 L21 10 Z" fill="none" stroke="#3d85ff" stroke-width="1.3" stroke-linejoin="round"/>
        <circle cx="18" cy="20" r="3.5" fill="#060d1a" stroke="#3d85ff" stroke-width="1.3"/>
        <circle cx="7" cy="20" r="3.5" fill="#060d1a" stroke="#3d85ff" stroke-width="1.3"/>
        <circle cx="26" cy="3" r="4" fill="none" stroke="#6aa3ff" stroke-width="1.2"/>
        <line x1="29" y1="6" x2="32" y2="9" stroke="#6aa3ff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="38" y="18" font-family="IBM Plex Sans Arabic,sans-serif" font-size="14" font-weight="600" fill="#f0f4ff" letter-spacing="1">كاشف</text>
      <text x="38" y="31" font-family="IBM Plex Sans Arabic,sans-serif" font-size="8" fill="#2a4a72">أداة تقييم المركبات</text>
    </svg>
  </div>
  <div class="topbar-right">
    <span class="u-name" id="u-name"></span>
    <div class="avatar" id="u-av">؟</div>
    <button class="btn-out" onclick="logout()">خروج</button>
  </div>
</div>

<div class="page">

  <!-- قسم الشاصي -->
  <div class="card vin-card">
    <div class="card-title">تحديد الموديل من رقم الشاصي</div>
    <div class="card-sub">أدخل رقم الشاصي (17 خانة) لاستخراج الماركة وسنة الموديل</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input class="vin-inp" id="vin-in" maxlength="17" placeholder="مثال: 1FMJK1KT5NEA12345" dir="ltr" oninput="this.value=this.value.toUpperCase().replace(/[IOQ]/g,'')" onkeydown="if(event.key==='Enter')decodeVIN()">
      <button class="btn btn-ghost" onclick="decodeVIN()">فك الشاصي</button>
    </div>
    <div class="msg" id="vin-err"></div>
    <div id="vin-result" style="display:none">
      <div style="background:var(--bg);border:1px solid var(--b1);border-radius:12px;padding:14px">
        <div class="vin-chars" id="vin-chars"></div>
        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
          <span style="font-size:10px;color:var(--t4);display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:#081f12;border:1px solid #0d5c33;display:inline-block"></span>المصنّع (1-3)</span>
          <span style="font-size:10px;color:var(--t4);display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:#1a1205;border:1px solid #7c4a0a;display:inline-block"></span>المواصفات (4-8)</span>
          <span style="font-size:10px;color:var(--t4);display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:#0a1530;border:1px solid #1e6fff;display:inline-block"></span>سنة الموديل (10)</span>
        </div>
        <div class="vin-info" id="vin-info"></div>
        <button class="btn btn-blue" style="width:100%;font-size:12px;padding:9px" onclick="searchFromVIN()">البحث في قاعدة البيانات</button>
      </div>
    </div>
  </div>

  <!-- قسم البحث -->
  <div class="card">
    <div class="card-title">البحث بالاسم أو الماركة</div>
    <div class="s-row">
      <input class="s-inp" id="s-in" placeholder="Camry، Land Cruiser، Ford، الغانم..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-blue" onclick="doSearch()">بحث</button>
    </div>
    <div class="flt-row">
      <span class="flt-lbl">تصفية:</span>
      <select class="sel" id="f-agency" onchange="doSearch()"><option value="">كل الوكالات</option></select>
      <select class="sel" id="f-year" onchange="doSearch()">
        <option value="">كل السنوات</option>
        <option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option>
      </select>
    </div>
  </div>

  <div class="cmp-panel" id="cmp-panel">
    <div style="font-size:13px;font-weight:500;color:var(--acc3);margin-bottom:12px">مقارنة السيارتين</div>
    <div class="cmp-grid" id="cmp-grid"></div>
  </div>

  <div class="res-hdr">
    <div class="res-cnt" id="res-cnt">أدخل اسم السيارة للبحث</div>
    <button class="cmp-btn" id="cmp-btn" onclick="showCmp()">مقارنة المحددين</button>
  </div>

  <div id="results">
    <div class="empty"><div class="empty-icon">🔍</div><div style="font-size:13px">ابحث عن موديل سيارة للبدء</div></div>
  </div>

</div>

<script>
const SURL='https://eyspitmovlwytllqtndv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5c3BpdG1vdmx3eXRsbHF0bmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzQzNTcsImV4cCI6MjA5NTM1MDM1N30.qUBjDq6--xDc6XTJXva6lJ9twWWKWlEVxi8S6WtB-oA';
const{createClient}=supabase;
const sb=createClient(SURL,SKEY);

let rates={};let rateDate='';let allRes=[];let selCards=[];let uid=null;let vinDecoded=null;

const WMI={
  '1FM':{make:'Ford',country:'USA'},'1FT':{make:'Ford',country:'USA'},'1FA':{make:'Ford',country:'USA'},
  '1G1':{make:'Chevrolet',country:'USA'},'1GC':{make:'Chevrolet',country:'USA'},'1GT':{make:'GMC',country:'USA'},
  '1G6':{make:'Cadillac',country:'USA'},'1GY':{make:'Cadillac',country:'USA'},'1LN':{make:'Lincoln',country:'USA'},
  '1GK':{make:'GMC',country:'USA'},'1F':{make:'Ford',country:'USA'},'1G':{make:'GM',country:'USA'},
  'JHM':{make:'Honda',country:'Japan'},'JH':{make:'Honda',country:'Japan'},
  'JTD':{make:'Toyota',country:'Japan'},'JTJ':{make:'Lexus',country:'Japan'},'JTH':{make:'Lexus',country:'Japan'},'JT':{make:'Toyota',country:'Japan'},
  'JN':{make:'Nissan',country:'Japan'},'JM':{make:'Mazda',country:'Japan'},'JF':{make:'Subaru',country:'Japan'},
  'KMH':{make:'Hyundai',country:'Korea'},'KNA':{make:'Kia',country:'Korea'},'KM':{make:'Hyundai/Kia',country:'Korea'},
  'WBA':{make:'BMW',country:'Germany'},'WBS':{make:'BMW M',country:'Germany'},
  'WDD':{make:'Mercedes-Benz',country:'Germany'},'WDB':{make:'Mercedes-Benz',country:'Germany'},'WDC':{make:'Mercedes-Benz',country:'Germany'},
  'WMW':{make:'MINI',country:'Germany'},'WVW':{make:'Volkswagen',country:'Germany'},
  'WAU':{make:'Audi',country:'Germany'},'WP0':{make:'Porsche',country:'Germany'},
  'SAL':{make:'Land Rover',country:'UK'},'SAJ':{make:'Jaguar',country:'UK'},'SCA':{make:'Rolls-Royce',country:'UK'},
  'VF3':{make:'Peugeot',country:'France'},'VF1':{make:'Renault',country:'France'},
  'ZFF':{make:'Ferrari',country:'Italy'},'ZHW':{make:'Lamborghini',country:'Italy'},
  'MNB':{make:'Toyota',country:'Thailand'},'MBH':{make:'Honda',country:'India'},
};
const YEARS={'R':2024,'S':2025,'T':2026,'P':2023,'N':2022,'M':2021,'L':2020,'K':2019,'J':2018,'H':2017,'G':2016,'F':2015,'E':2014,'D':2013,'C':2012,'B':2011,'A':2010,'9':2009,'8':2008,'7':2007,'6':2006,'5':2005,'4':2004,'3':2003,'2':2002,'1':2001,'Y':2000,'X':1999,'W':1998,'V':1997};

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p?.is_approved){window.location.href='index.html';return;}
  uid=session.user.id;
  document.getElementById('u-name').textContent=p.full_name;
  document.getElementById('u-av').textContent=p.full_name[0];
  await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',uid);
  await loadRates();
  await loadAgencies();
}

async function loadRates(){
  const today=new Date().toISOString().split('T')[0];
  const{data:r}=await sb.from('exchange_rates').select('*').lte('valid_from',today).order('valid_from',{ascending:false}).limit(1).single();
  if(r){rates=r.rates||{};rateDate=r.valid_from;}
}

async function loadAgencies(){
  const{data}=await sb.from('agencies').select('id,name_ar').order('name_ar');
  if(!data)return;
  const sel=document.getElementById('f-agency');
  data.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name_ar;sel.appendChild(o);});
}

function toKWD(amount,currency){
  if(currency==='KWD')return amount;
  const rate=rates[currency];
  if(!rate)return amount;
  // الأسعار بالفلس، نحولها للدينار
  return amount*(rate/1000);
}

function fmt(n,d=3){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}

function decodeVIN(){
  const vin=document.getElementById('vin-in').value.trim().toUpperCase();
  const errEl=document.getElementById('vin-err');
  const res=document.getElementById('vin-result');
  errEl.className='msg';res.style.display='none';
  if(vin.length!==17){errEl.textContent=`رقم الشاصي يجب أن يكون 17 خانة — أدخلت ${vin.length} خانة`;errEl.className='msg err';return;}
  const w3=vin.substring(0,3),w2=vin.substring(0,2);
  const wmi=WMI[w3]||WMI[w2]||null;
  const year=YEARS[vin[9]]||null;
  vinDecoded={vin,wmi,year};
  document.getElementById('vin-chars').innerHTML=vin.split('').map((c,i)=>{
    let cls='';
    if(i<3)cls='wmi';else if(i>=3&&i<=7)cls='vds';else if(i===9)cls='yr';
    return `<div class="vc ${cls}">${c}<span class="vc-n">${i+1}</span></div>`;
  }).join('');
  document.getElementById('vin-info').innerHTML=`
    <div class="vi-box"><div class="vi-lbl">الماركة</div><div class="vi-val blue">${wmi?wmi.make:'غير معروف'}</div></div>
    <div class="vi-box"><div class="vi-lbl">بلد التصنيع</div><div class="vi-val green">${wmi?wmi.country:'غير معروف'}</div></div>
    <div class="vi-box"><div class="vi-lbl">سنة الموديل</div><div class="vi-val amber">${year||'غير معروف'}</div></div>
    <div class="vi-box"><div class="vi-lbl">WMI</div><div class="vi-val" style="font-family:monospace">${vin.substring(0,3)}</div></div>
    <div class="vi-box"><div class="vi-lbl">VDS</div><div class="vi-val" style="font-family:monospace">${vin.substring(3,8)}</div></div>
    <div class="vi-box"><div class="vi-lbl">الرقم التسلسلي</div><div class="vi-val" style="font-family:monospace">${vin.substring(11)}</div></div>`;
  res.style.display='block';
}

async function searchFromVIN(){
  if(!vinDecoded)return;
  const make=vinDecoded.wmi?vinDecoded.wmi.make.split('/')[0].split(' ')[0]:'';
  if(make){
    document.getElementById('s-in').value=make;
    if(vinDecoded.year)document.getElementById('f-year').value=vinDecoded.year;
    await doSearch();
  }
}

async function doSearch(){
  const q=document.getElementById('s-in').value.trim();
  const ag=document.getElementById('f-agency').value;
  const yr=document.getElementById('f-year').value;
  if(!q&&!ag){document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div style="font-size:13px">ابحث عن موديل سيارة للبدء</div></div>';return;}
  document.getElementById('res-cnt').textContent='جاري البحث...';
  let qr=sb.from('vehicles').select('*,agencies(name_ar)').eq('is_active',true);
  if(q)qr=qr.or(`brand.ilike.%${q}%,model.ilike.%${q}%,description.ilike.%${q}%,variant.ilike.%${q}%`);
  if(ag)qr=qr.eq('agency_id',ag);
  if(yr)qr=qr.eq('model_year',parseInt(yr));
  const{data}=await qr.order('brand').order('model').limit(100);
  allRes=data||[];selCards=[];
  document.getElementById('cmp-btn').style.display='none';
  document.getElementById('cmp-panel').style.display='none';
  if(uid)await sb.from('search_logs').insert({user_id:uid,search_query:q,results_count:allRes.length});
  renderRes();
}

function renderRes(){
  document.getElementById('res-cnt').textContent=`${allRes.length} نتيجة`;
  if(!allRes.length){document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">😶</div><div style="font-size:13px">لا توجد نتائج</div></div>';return;}
  document.getElementById('results').innerHTML=allRes.map((v,i)=>{
    const kwd=toKWD(v.price_amount,v.price_currency);
    const duty=kwd*(v.customs_duty_pct/100);
    const total=kwd+duty;
    const isSel=selCards.includes(i);
    // تحويل للعملات الأخرى
    const usdRate=rates['USD']?rates['USD']/1000:0.307105;
    const eurRate=rates['EUR']?rates['EUR']/1000:0.334;
    const jpyRate=rates['JPY']?rates['JPY']/1000:0.002175;
    const usd=usdRate?kwd/usdRate:0;
    const eur=eurRate?kwd/eurRate:0;
    const jpy=jpyRate?kwd/jpyRate:0;
    return `<div class="res-card ${isSel?'sel':''}" onclick="toggleSel(${i})">
      <div class="res-top">
        <div class="res-name">${v.brand} ${v.model}</div>
        <div class="res-badges">
          ${v.model_year?`<span class="bdg bdg-blue">موديل ${v.model_year}</span>`:''}
          ${v.origin_country?`<span class="bdg bdg-green">${v.origin_country}</span>`:''}
        </div>
      </div>
      <div class="res-meta">${v.agencies?.name_ar||''} ${v.variant?`&nbsp;·&nbsp;<span class="res-var">${v.variant}</span>`:''}</div>
      ${v.description?`<div style="font-size:11px;color:var(--t4);margin-bottom:10px;line-height:1.5">${v.description}</div>`:''}
      <div class="prices-g">
        <div class="pb kwd"><div class="pb-cur">دينار كويتي</div><div class="pb-val">${fmt(kwd)}</div></div>
        <div class="pb"><div class="pb-cur">دولار</div><div class="pb-val">${fmt(usd)}</div></div>
        <div class="pb"><div class="pb-cur">يورو</div><div class="pb-val">${fmt(eur)}</div></div>
        <div class="pb"><div class="pb-cur">ين ياباني</div><div class="pb-val">${fmt(jpy,0)}</div></div>
      </div>
      <div class="dvdr"></div>
      <div class="tax-row">
        <div class="tax-lbl">ضريبة جمركية ${v.customs_duty_pct}%</div>
        <div class="tax-right">
          <span style="font-size:11px;color:var(--t4)">+ ${fmt(duty)} د.ك</span>
          <span class="tax-bdg">الإجمالي: ${fmt(total)} د.ك</span>
          <button class="print-b" onclick="event.stopPropagation();printCard(${i})">طباعة</button>
        </div>
      </div>
      ${rateDate?`<div class="rate-info">سعر الصرف: ${rateDate}</div>`:''}
    </div>`;
  }).join('');
}

function toggleSel(i){
  const idx=selCards.indexOf(i);
  if(idx>-1)selCards.splice(idx,1);
  else{if(selCards.length>=2)selCards.shift();selCards.push(i);}
  document.getElementById('cmp-btn').style.display=selCards.length===2?'block':'none';
  renderRes();
}

function showCmp(){
  if(selCards.length!==2)return;
  const panel=document.getElementById('cmp-panel');
  panel.style.display='block';
  document.getElementById('cmp-grid').innerHTML=selCards.map(i=>{
    const v=allRes[i];const kwd=toKWD(v.price_amount,v.price_currency);const duty=kwd*(v.customs_duty_pct/100);
    return `<div class="cmp-item">
      <div class="cmp-name">${v.brand} ${v.model}</div>
      <div class="cmp-row"><span class="cmp-k">الوكالة</span><span class="cmp-v">${v.agencies?.name_ar||'-'}</span></div>
      <div class="cmp-row"><span class="cmp-k">السنة</span><span class="cmp-v">${v.model_year||'-'}</span></div>
      <div class="cmp-row"><span class="cmp-k">بلد المنشأ</span><span class="cmp-v">${v.origin_country||'-'}</span></div>
      <div class="cmp-row"><span class="cmp-k">السعر (د.ك)</span><span class="cmp-v hl">${fmt(kwd)}</span></div>
      <div class="cmp-row"><span class="cmp-k">الضريبة</span><span class="cmp-v">${fmt(duty)}</span></div>
      <div class="cmp-row"><span class="cmp-k">الإجمالي</span><span class="cmp-v hl">${fmt(kwd+duty)}</span></div>
    </div>`;
  }).join('');
  panel.scrollIntoView({behavior:'smooth'});
}

function printCard(i){
  const v=allRes[i];
  const kwd=toKWD(v.price_amount,v.price_currency);
  const duty=kwd*(v.customs_duty_pct/100);
  const usdRate=rates['USD']?rates['USD']/1000:0.307105;
  const usd=usdRate?kwd/usdRate:0;
  const win=window.open('','_blank');
  win.document.write(`<html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Arial;padding:30px;color:#111}h2{margin-bottom:4px}.meta{color:#666;font-size:13px;margin-bottom:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}td,th{border:1px solid #ddd;padding:8px 12px;font-size:13px}th{background:#f5f5f5}.total{font-weight:bold;color:#1d4ed8}.footer{font-size:11px;color:#999;margin-top:20px;text-align:center}.notice{font-size:10px;color:#888;margin-top:10px;border:1px solid #eee;padding:8px;border-radius:4px}</style></head><body>
    <h2>${v.brand} ${v.model} ${v.model_year||''}</h2>
    <div class="meta">${v.agencies?.name_ar||''} ${v.variant?'· '+v.variant:''} ${v.origin_country?'· '+v.origin_country:''}</div>
    <table>
      <tr><th>البند</th><th>القيمة</th></tr>
      <tr><td>السعر الأصلي</td><td>${Number(v.price_amount).toLocaleString()} ${v.price_currency}</td></tr>
      <tr><td>القيمة بالدينار الكويتي</td><td>${fmt(kwd)} د.ك</td></tr>
      <tr><td>القيمة بالدولار</td><td>${fmt(usd)} USD</td></tr>
      <tr><td>الضريبة الجمركية ${v.customs_duty_pct}%</td><td>${fmt(duty)} د.ك</td></tr>
      <tr><td class="total">الإجمالي</td><td class="total">${fmt(kwd+duty)} د.ك</td></tr>
    </table>
    ${rateDate?`<p style="font-size:11px;color:#666">سعر الصرف المعتمد: ${rateDate}</p>`:''}
    <div class="notice">⚠️ هذه الأداة غير رسمية. الأسعار تقريبية وقابلة للخطأ، يرجى المراجعة والتحقق.</div>
    <div class="footer">منصة كاشف — ${new Date().toLocaleDateString('ar-KW')}</div>
    <script>window.print();window.close();<\/script></body></html>`);
}

async function logout(){await sb.auth.signOut();window.location.href='index.html';}
init();
</script>
